<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC AVIATION - Opérations</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#eef3f9;
  background-image:linear-gradient(180deg,#0d3b66 0%,#184f8d 180px,#eef3f9 180px);
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
}

.header{
  background:linear-gradient(135deg,#003b70,#0d5ca6);
  border-radius:25px;
  padding:30px;
  text-align:center;
  color:white;
  box-shadow:0 15px 40px rgba(0,0,0,.20);
  margin-bottom:25px;
}

.logo{
  width:220px;
  max-width:90%;
  margin-bottom:18px;
}

.header h1{
  font-size:30px;
  font-weight:700;
  letter-spacing:1px;
}

.header p{
  margin-top:8px;
  opacity:.9;
  font-size:15px;
}

.card{
  background:white;
  border-radius:25px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  margin-bottom:25px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:14px;
  margin-bottom:22px;
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  color:#5b6b7c;
  font-weight:600;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 rgba(34,197,94,.5);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}
  70%{box-shadow:0 0 0 8px rgba(34,197,94,0);}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}

.refresh-btn{
  border:none;
  border-radius:14px;
  padding:12px 22px;
  font-size:15px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,#003b70,#0d5ca6);
  cursor:pointer;
  box-shadow:0 8px 20px rgba(13,92,166,.30);
  transition:.25s;
}

.refresh-btn:hover{
  transform:translateY(-2px);
}

.refresh-btn:active{
  transform:translateY(0);
}

.table-wrap{
  overflow-x:auto;
  border-radius:18px;
  border:2px solid #eef1f6;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:820px;
}

thead th{
  background:#f7f9fc;
  color:#003b70;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.5px;
  padding:16px 18px;
  text-align:left;
  border-bottom:2px solid #eef1f6;
}

tbody td{
  padding:16px 18px;
  border-bottom:1px solid #eef1f6;
  font-size:14.5px;
  color:#23374d;
  vertical-align:middle;
}

tbody tr:hover{
  background:#fafcff;
}

tbody tr:last-child td{
  border-bottom:none;
}

.immat{
  font-weight:700;
  color:#003b70;
  letter-spacing:.5px;
}

.datetime{
  color:#5b6b7c;
  white-space:nowrap;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  display:inline-block;
  padding:5px 12px;
  border-radius:100px;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
}

.badge-cafe{ background:#fef3c7; color:#92400e; }
.badge-eau{ background:#dbeafe; color:#1e40af; }
.badge-glace{ background:#e0f2fe; color:#075985; }
.badge-poubelle{ background:#f3e8ff; color:#6b21a8; }
.badge-wc{ background:#fee2e2; color:#991b1b; }
.badge-eaupotable{ background:#dcfce7; color:#166534; }
.badge-gpu-on{ background:#dcfce7; color:#166534; }
.badge-gpu-off{ background:#fee2e2; color:#991b1b; }

.comment{
  color:#5b6b7c;
  max-width:220px;
  font-style:italic;
}

.traite-btn{
  border:none;
  border-radius:12px;
  padding:9px 16px;
  font-size:13px;
  font-weight:700;
  color:#166534;
  background:#dcfce7;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}

.traite-btn:hover{
  background:#bbf7d0;
  transform:translateY(-1px);
}

.traite-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#8a99a8;
}

.empty-icon{
  font-size:42px;
  margin-bottom:14px;
}

.footer{
  text-align:center;
  color:#8a99a8;
  font-size:13px;
  margin-top:10px;
}

@media(max-width:650px){
  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }
  .refresh-btn{
    width:100%;
  }
}
</style>
</head>

    <h1>📊 OPÉRATIONS - SERVICES PISTE</h1>
    <p>Suivi en temps réel des demandes</p>
  </div>

  <div class="card">

    <div class="toolbar">
      <div class="status">
        <span class="dot"></span>
        <span id="statusText">Dernière mise à jour : --:--:--</span>
      </div>
      <button class="refresh-btn" onclick="chargerDonnees()">🔄 Rafraîchir maintenant</button>
    </div>

    <div class="table-wrap">
      <table id="tableau">
        <thead>
          <tr>
            <th>Date</th>
            <th>Heure</th>
            <th>Immat</th>
            <th>Agent</th>
            <th>Services</th>
            <th>Commentaire</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

  </div>

  <div class="footer">DC AVIATION © Ground Operations • Rafraîchissement automatique toutes les 10 secondes</div>

</div>

<script>
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwjxqJdyVTAj6WIx4fuOAZp-y9lzaWEXEr02ATNnqB68_zGEmxnjDCcy6P5dH-6jo_3/exec";

  function formatDate(value){
    if(!value) return "";
    const d = new Date(value);
    if(isNaN(d)) return value;
    return d.toLocaleDateString("fr-FR",{
      day:"2-digit", month:"2-digit", year:"2-digit", timeZone:"Europe/Paris"
    });
  }

  function formatHeure(value){
    if(!value) return "";
    const d = new Date(value);
    if(isNaN(d)) return value;
    return d.toLocaleTimeString("fr-FR",{
      hour:"2-digit", minute:"2-digit", hour12:false, timeZone:"Europe/Paris"
    });
  }

  // Index des colonnes (0 = ID ajouté en colonne A du Sheet) :
  // 0:id 1:date 2:heure 3:immat 4:agent 5:cafe 6:eauChaude 7:kilosGlace
  // 8:sacsFrigo 9:sacsCongelateur 10:sacsAmbiant 11:poubelle 12:gpu
  // 13:vidangeWC 14:eauPotable 15:commentaire 16:photo

  function construireBadges(row){
    const badges = [];

    if(row[5]) badges.push(`<span class="badge badge-cafe">☕ Café</span>`);
    if(row[6]) badges.push(`<span class="badge badge-eau">💧 Eau chaude</span>`);
    if(row[7]) badges.push(`<span class="badge badge-glace">❄️ ${row[7]} kg glace</span>`);
    if(row[8]) badges.push(`<span class="badge badge-glace">🧊 ${row[8]} sacs frigo</span>`);
    if(row[9]) badges.push(`<span class="badge badge-glace">🥶 ${row[9]} sacs congél.</span>`);
    if(row[10]) badges.push(`<span class="badge badge-glace">📦 ${row[10]} sacs ambiant</span>`);
    if(row[11]) badges.push(`<span class="badge badge-poubelle">🗑️ Poubelle</span>`);
    if(row[12]){
      const cls = row[12].includes("Début") ? "badge-gpu-on" : "badge-gpu-off";
      const icon = row[12].includes("Début") ? "🟢" : "🔴";
      badges.push(`<span class="badge ${cls}">${icon} ${row[12]}</span>`);
    }
    if(row[13]) badges.push(`<span class="badge badge-wc">🚽 Vidange WC</span>`);
    if(row[14]) badges.push(`<span class="badge badge-eaupotable">🚰 Eau potable</span>`);

    return badges.length ? `<div class="badges">${badges.join("")}</div>` : "—";
  }

  async function chargerDonnees() {
    try {
      const res = await fetch(WEBAPP_URL);
      const data = await res.json();

      const tbody = document.getElementById("tbody");

      if (!data || data.length <= 1) {
        tbody.innerHTML = `<tr><td colspan="7">
          <div class="empty">
            <div class="empty-icon">📭</div>
            Aucun service enregistré pour le moment
          </div>
        </td></tr>`;
      } else {
        const lignes = data.slice(1).reverse();
        let html = "";

        for (const row of lignes) {
          const id = row[0];
          html += `<tr id="row-${id}">
            <td class="datetime">${formatDate(row[1])}</td>
            <td class="datetime">${formatHeure(row[2])}</td>
            <td class="immat">${row[3] || ''}</td>
            <td>${row[4] || ''}</td>
            <td>${construireBadges(row)}</td>
            <td class="comment">${row[15] || ''}</td>
            <td><button class="traite-btn" onclick="traiterService('${id}', this)">✅ Traité</button></td>
          </tr>`;
        }

        tbody.innerHTML = html;
      }

      const maintenant = new Date().toLocaleTimeString("fr-FR", { timeZone: "Europe/Paris" });
      document.getElementById("statusText").textContent = `Dernière mise à jour : ${maintenant}`;

    } catch (e) {
      console.error("Erreur :", e);
      document.getElementById("statusText").textContent = "⚠️ Erreur de connexion";
    }
  }

  async function traiterService(id, btn) {
    if (!confirm("Marquer ce service comme traité et l'archiver ?")) return;

    btn.disabled = true;
    btn.textContent = "...";

    try {
      await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "traiter", id: id })
      });

      const ligne = document.getElementById(`row-${id}`);
      if (ligne) ligne.remove();

    } catch (e) {
      console.error("Erreur :", e);
      alert("❌ Impossible de traiter ce service, réessayez.");
      btn.disabled = false;
      btn.textContent = "✅ Traité";
    }
  }

  setInterval(chargerDonnees, 10000);
  chargerDonnees();
</script>
