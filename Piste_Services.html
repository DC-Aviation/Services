<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Piste - Chafik</title>
<style>
body{font-family:Arial,sans-serif;padding:15px;background:#f0f8ff;margin:0}
h1{color:#1e3a8a;text-align:center}
label{font-weight:bold;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:12px;margin:10px 0;font-size:16px;box-sizing:border-box}
.service{margin:15px 0;font-size:18px}
.service input{width:auto;margin-right:10px}
button{padding:18px;font-size:20px;background:#1e3a8a;color:#fff;border:none;width:100%;margin-top:20px;border-radius:8px}
</style>
</head>
<body>
<h1>🛩️ Services Piste</h1>
<label>Immatriculation de l’avion :</label>
<input type="text" id="immat" placeholder="Ex : F-ABCD ou N-1234" required>
<div class="service"><label><input type="checkbox" id="cafe"> Café</label></div>
<div class="service"><label><input type="checkbox" id="eauChaude"> Eau chaude</label></div>
<label>Kilos de glace (1-40) :</label><input type="number" id="kilosGlace" min="0" max="40">
<label>Sacs frigo :</label><input type="number" id="sacsFrigo" min="0">
<label>Sacs congélateur :</label><input type="number" id="sacsCongelateur" min="0">
<label>Sacs ambiant :</label><input type="number" id="sacsAmbiant" min="0">
<div class="service"><label><input type="checkbox" id="poubelle"> Poubelle ramassée</label></div>
<label>GPU :</label>
<select id="gpu"><option value="">Aucun</option><option>Début GPU</option><option>Fin GPU</option></select>
<div class="service"><label><input type="checkbox" id="vidangeWC"> Vidange toilette</label></div>
<div class="service"><label><input type="checkbox" id="eauPotable"> Plein Eau potable</label></div>
<label>Commentaire :</label><textarea id="commentaire" rows="3"></textarea>
<label>Prendre une photo :</label><input type="file" id="photo" accept="image/*" capture="environment">
<button onclick="envoyer()">✅ Valider le service</button>
<script>
const WEBAPP_URL="https://script.google.com/macros/s/AKfycbyLomW7E790mcLR2RzOnyDe34WSfQ1rkjNUk-yAhAbDLsmxe4rDzKwN9FxXD1EZa5e8/exec";
async function envoyer(){
if(!immat.value){alert("⚠️ Tu dois mettre l'immatriculation !");return;}
const data={immat:immat.value.toUpperCase(),cafe:cafe.checked,eauChaude:eauChaude.checked,kilosGlace:kilosGlace.value,sacsFrigo:sacsFrigo.value,sacsCongelateur:sacsCongelateur.value,sacsAmbiant:sacsAmbiant.value,poubelle:poubelle.checked,gpu:gpu.value,vidangeWC:vidangeWC.checked,eauPotable:eauPotable.checked,commentaire:commentaire.value};
const file=photo.files[0];
if(file){const r=new FileReader();r.onload=async e=>{data.photo=e.target.result.substring(0,15000);await fetch(WEBAPP_URL,{method:"POST",body:JSON.stringify(data)});alert("✅ Service enregistré avec photo !");resetForm();};r.readAsDataURL(file);}
else{await fetch(WEBAPP_URL,{method:"POST",body:JSON.stringify(data)});alert("✅ Service enregistré !");resetForm();}
}
function resetForm(){document.querySelector("form")?.reset();immat.value="";document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);document.querySelectorAll('input[type=number]').forEach(x=>x.value="");gpu.value="";commentaire.value="";photo.value="";immat.focus();}
</script>
</body></html>
