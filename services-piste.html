<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC AVIATION - Services Piste</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#eef3f9;
  background-image:linear-gradient(180deg,#0d3b66 0%,#184f8d 180px,#eef3f9 180px);
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.header{
  background:linear-gradient(135deg,#003b70,#0d5ca6);
  border-radius:25px;
  padding:30px;
  text-align:center;
  color:white;
  box-shadow:0 15px 40px rgba(0,0,0,.20);
  margin-bottom:25px;
}

.logo{
  width:220px;
  max-width:90%;
  margin-bottom:18px;
}

.header h1{
  font-size:32px;
  font-weight:700;
  letter-spacing:1px;
}

.header p{
  margin-top:8px;
  opacity:.9;
  font-size:15px;
}

.card{
  background:white;
  border-radius:25px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  margin-bottom:25px;
}

.section-title{
  font-size:20px;
  font-weight:700;
  color:#003b70;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:10px;
}

.field{
  margin-bottom:20px;
}

.field label{
  display:block;
  font-weight:700;
  color:#23374d;
  margin-bottom:8px;
  font-size:15px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:15px;
  font-size:17px;
  border-radius:14px;
  border:2px solid #dfe7ef;
  transition:.25s;
  background:#fafcff;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  outline:none;
  border-color:#0d5ca6;
  background:white;
  box-shadow:0 0 0 4px rgba(13,92,166,.12);
}

.field textarea{
  resize:none;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:20px;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }
}

.services{
  margin-top:25px;
}

.service{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 20px;
  background:#f7f9fc;
  border-radius:16px;
  margin-bottom:12px;
  border:2px solid transparent;
  transition:.25s;
}

.service:hover{
  border-color:#0d5ca6;
  background:white;
}

.service label{
  font-size:17px;
  font-weight:700;
  color:#23374d;
  cursor:pointer;
}

.service input[type=checkbox]{
  width:28px;
  height:28px;
  accent-color:#0d5ca6;
  cursor:pointer;
}

.preview{
  display:none;
  margin-top:12px;
  max-width:100%;
  max-height:220px;
  border-radius:14px;
  border:2px solid #dfe7ef;
}

.preview.show{
  display:block;
}

button{
  margin-top:10px;
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#003b70,#0d5ca6);
  transition:.3s;
  box-shadow:0 10px 25px rgba(13,92,166,.30);
}

button:hover{
  transform:translateY(-2px);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.toast{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translate(-50%,20px);
  background:#0d3b66;
  color:white;
  padding:16px 26px;
  border-radius:14px;
  font-weight:600;
  font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:999;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.footer{
  margin-top:20px;
  text-align:center;
  color:#8a99a8;
  font-size:13px;
}

.login-overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#0d3b66 0%,#184f8d 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.login-card{
  background:white;
  border-radius:25px;
  padding:36px 32px;
  max-width:380px;
  width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  text-align:center;
}

.login-card .lock{
  font-size:38px;
  margin-bottom:10px;
}

.login-card h2{
  color:#003b70;
  font-size:22px;
  margin-bottom:6px;
}

.login-card p{
  color:#5b6b7c;
  font-size:14px;
  margin-bottom:22px;
}

.login-card .field{
  text-align:left;
}

.login-error{
  color:#b91c1c;
  font-size:13.5px;
  font-weight:600;
  margin-top:-8px;
  margin-bottom:16px;
  display:none;
}

.login-error.show{
  display:block;
}

.hidden{
  display:none !important;
}

.logout-link{
  display:block;
  text-align:center;
  margin-top:16px;
  color:#8a99a8;
  font-size:13px;
  cursor:pointer;
  text-decoration:underline;
}
</style>
</head>

<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <div class="lock">🔒</div>
    <h2>Connexion Agent</h2>
    <p>Entrez vos identifiants pour accéder au formulaire</p>

    <div class="field">
      <label>Identifiant</label>
      <input type="text" id="loginId" placeholder="Votre identifiant">
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="loginPwd" placeholder="Votre mot de passe">
    </div>

    <div id="loginError" class="login-error">⚠️ Identifiants invalides</div>

    <button id="loginBtn" onclick="connecterAgent()">Se connecter</button>
  </div>
</div>

<script>
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwjxqJdyVTAj6WIx4fuOAZp-y9lzaWEXEr02ATNnqB68_zGEmxnjDCcy6P5dH-6jo_3/exec";

  const photoInput = document.getElementById('photo');

  /* ---------- AUTHENTIFICATION ---------- */

  function verifierSession() {
    const id = sessionStorage.getItem('agent_id');
    const pwd = sessionStorage.getItem('agent_pwd');
    const nom = sessionStorage.getItem('agent_nom');

    if (id && pwd && nom) {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('agent').value = nom;
    }
  }

  async function connecterAgent() {
    const id = document.getElementById('loginId').value.trim();
    const pwd = document.getElementById('loginPwd').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    errorEl.classList.remove('show');

    if (!id || !pwd) {
      errorEl.textContent = "⚠️ Identifiant et mot de passe requis";
      errorEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = "Connexion...";

    try {
      const res = await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "loginAgent", identifiant: id, motDePasse: pwd })
      });
      const result = await res.json();

      if (result.status === "ok") {
        sessionStorage.setItem('agent_id', id);
        sessionStorage.setItem('agent_pwd', pwd);
        sessionStorage.setItem('agent_nom', result.nom);
        verifierSession();
      } else {
        errorEl.textContent = "⚠️ Identifiants invalides";
        errorEl.classList.add('show');
      }
    } catch (err) {
      errorEl.textContent = "⚠️ Erreur de connexion réseau";
      errorEl.classList.add('show');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  }

  function deconnecter() {
    sessionStorage.removeItem('agent_id');
    sessionStorage.removeItem('agent_pwd');
    sessionStorage.removeItem('agent_nom');
    location.reload();
  }

  verifierSession();

  /* ---------- FORMULAIRE ---------- */

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.classList.add('show');
      };
      reader.readAsDataURL(file);
    } else {
      preview.classList.remove('show');
      preview.src = '';
    }
  });

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function collecterDonnees() {
    return {
      identifiant: sessionStorage.getItem('agent_id'),
      motDePasse: sessionStorage.getItem('agent_pwd'),
      immat: document.getElementById('immat').value.toUpperCase(),
      cafe: document.getElementById('cafe').checked,
      eauChaude: document.getElementById('eauChaude').checked,
      kilosGlace: document.getElementById('kilosGlace').value,
      sacsFrigo: document.getElementById('sacsFrigo').value,
      sacsCongelateur: document.getElementById('sacsCongelateur').value,
      sacsAmbiant: document.getElementById('sacsAmbiant').value,
      poubelle: document.getElementById('poubelle').checked,
      gpu: document.getElementById('gpu').value,
      vidangeWC: document.getElementById('vidangeWC').checked,
      eauPotable: document.getElementById('eauPotable').checked,
      commentaire: document.getElementById('commentaire').value,
      horodatage: new Date().toISOString()
    };
  }

  async function envoyer() {
    if (!document.getElementById('immat').value) {
      alert("⚠️ Immatriculation requise !");
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = "Envoi en cours...";

    const data = collecterDonnees();
    const file = photoInput.files[0];

    try {
      if (file) {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        data.photo = dataUrl.substring(0, 15000);
      }

      const res = await fetch(WEBAPP_URL, { method: "POST", body: JSON.stringify(data) });
      const result = await res.json();

      if (result.status === "error") {
        alert("⚠️ Session expirée ou invalide, veuillez vous reconnecter.");
        deconnecter();
        return;
      }

      showToast("✅ Service enregistré");
      resetForm();
    } catch (err) {
      alert("❌ Erreur d'envoi, vérifiez votre connexion.");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "✔ VALIDER LE SERVICE";
    }
  }

  function resetForm() {
    document.getElementById('immat').value = '';
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.querySelectorAll('input[type="number"], textarea').forEach(el => el.value = '');
    document.getElementById('gpu').value = '';
    photoInput.value = '';
    preview.classList.remove('show');
    preview.src = '';
  }
</script>

</body>
</html>
